version: "2"
sql:
  - engine: "mysql"
    schema: "migrations"
    queries: "internal/adapters/mariadb/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/adapters/mariadb/sqlcgen"
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
