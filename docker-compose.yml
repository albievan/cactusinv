# cactusInv on Docker (Docker Desktop or any Docker Engine). Settings and volume
# mappings come from .env; secrets from files in ${SECRETS_DIR}. Use ./deploy.sh.
name: cactusinv

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes:
      - ${MARIADB_DATA_DIR}:/var/lib/mysql
      # Creates <db>_restore, the restore staging database, on a new data directory.
      - ./deploy/mariadb/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  # The app runs as uid 65532; make the mapped invoices and backups folders writable for
  # it (backups only for it: they hold the encrypted copies of everything).
  volume-init:
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 65532:65532 /data/invoices /data/backups && chmod 750 /data/invoices && chmod 700 /data/backups"]
    volumes:
      - ${INVOICES_DIR}:/data/invoices
      - ${BACKUP_DIR}:/data/backups
    restart: "no"

  app:
    image: ${CACTUSINV_IMAGE}
    build:
      context: .
      args:
        VERSION: ${CACTUSINV_VERSION:-dev}
        BUILD: ${CACTUSINV_BUILD:-0}
    restart: unless-stopped
    # The app needs up to ~20 s to drain requests and record an e-mail being sent.
    stop_grace_period: 30s
    depends_on:
      mariadb: { condition: service_healthy }
      volume-init: { condition: service_completed_successfully }
    environment:
      TZ: ${TZ}
      CACTUSINV_DB_HOST: mariadb
      CACTUSINV_DB_NAME: ${MARIADB_DATABASE}
      CACTUSINV_DB_USER: ${MARIADB_USER}
      CACTUSINV_SECRETS: file
      CACTUSINV_SECRETS_DIR: /run/secrets
      CACTUSINV_INVOICES_DIR: /data/invoices
      CACTUSINV_MIGRATE_ON_START: "true"
      CACTUSINV_LOG_LEVEL: ${CACTUSINV_LOG_LEVEL}
      CACTUSINV_COOKIE_SECURE: ${CACTUSINV_COOKIE_SECURE}
      CACTUSINV_DEFAULT_ADMIN_USER: ${CACTUSINV_DEFAULT_ADMIN_USER}
      CACTUSINV_DEFAULT_ADMIN_PASSWORD: ${CACTUSINV_DEFAULT_ADMIN_PASSWORD}
      CACTUSINV_SMTP_HOST: ${CACTUSINV_SMTP_HOST}
      CACTUSINV_SMTP_PORT: ${CACTUSINV_SMTP_PORT}
      CACTUSINV_SMTP_TLS: ${CACTUSINV_SMTP_TLS}
      CACTUSINV_SMTP_USER: ${CACTUSINV_SMTP_USER}
      CACTUSINV_SMTP_FROM: ${CACTUSINV_SMTP_FROM}
      # Encrypted backups taken by the app (ADR-010); the restore staging database is
      # <MARIADB_DATABASE>_restore.
      CACTUSINV_BACKUP_DIR: /data/backups
      CACTUSINV_BACKUP_TIMES: ${BACKUP_TIMES}
      CACTUSINV_BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      CACTUSINV_BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB}
      # What System Settings show as mapped now (deploy.sh sets the absolute folders).
      CACTUSINV_DEPLOY_TARGET: ${CACTUSINV_DEPLOY_TARGET:-dockerdesktop}
      CACTUSINV_HOST_PROJECT_DIR: ${CACTUSINV_HOST_PROJECT_DIR:-}
      CACTUSINV_HOST_BACKUP_DIR: ${CACTUSINV_HOST_BACKUP_DIR:-${BACKUP_DIR}}
      CACTUSINV_HOST_INVOICES_DIR: ${CACTUSINV_HOST_INVOICES_DIR:-${INVOICES_DIR}}
    secrets: [db_password, smtp_password, app_key, backup_key]
    volumes:
      - ${INVOICES_DIR}:/data/invoices
      - ${BACKUP_DIR}:/data/backups
    ports:
      - "${HTTP_PORT}:8080"

  mailpit:
    image: axllent/mailpit:v1.21
    profiles: [mailpit]
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT}:8025"

secrets:
  db_password:
    file: ${SECRETS_DIR}/db_password
  db_root_password:
    file: ${SECRETS_DIR}/db_root_password
  smtp_password:
    file: ${SECRETS_DIR}/smtp_password
  app_key:
    file: ${SECRETS_DIR}/app_key
  backup_key:
    file: ${SECRETS_DIR}/backup_key
