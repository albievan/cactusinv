# cactusInv on k3s / Kubernetes. Rendered by deploy.sh, which fills the placeholders from .env.
# The Secret cactusinv-secrets (db_password, db_root_password, smtp_password, app_key,
# backup_key) is created and completed by deploy.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactusinv }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cactusinv-config
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactusinv }
data:
  TZ: "${TZ}"
  CACTUSINV_DB_HOST: mariadb
  CACTUSINV_DB_NAME: "${MARIADB_DATABASE}"
  CACTUSINV_DB_USER: "${MARIADB_USER}"
  CACTUSINV_SECRETS: file
  CACTUSINV_SECRETS_DIR: /run/secrets
  CACTUSINV_INVOICES_DIR: /data/invoices
  CACTUSINV_MIGRATE_ON_START: "true"
  CACTUSINV_LOG_LEVEL: "${CACTUSINV_LOG_LEVEL}"
  CACTUSINV_COOKIE_SECURE: "${CACTUSINV_COOKIE_SECURE}"
  CACTUSINV_DEFAULT_ADMIN_USER: "${CACTUSINV_DEFAULT_ADMIN_USER}"
  CACTUSINV_DEFAULT_ADMIN_PASSWORD: "${CACTUSINV_DEFAULT_ADMIN_PASSWORD}"
  CACTUSINV_SMTP_HOST: "${CACTUSINV_SMTP_HOST}"
  CACTUSINV_SMTP_PORT: "${CACTUSINV_SMTP_PORT}"
  CACTUSINV_SMTP_TLS: "${CACTUSINV_SMTP_TLS}"
  CACTUSINV_SMTP_USER: "${CACTUSINV_SMTP_USER}"
  CACTUSINV_SMTP_FROM: "${CACTUSINV_SMTP_FROM}"
  # Encrypted backups taken by the app (ADR-010); restores stage into <db>_restore.
  CACTUSINV_BACKUP_DIR: /data/backups
  CACTUSINV_BACKUP_TIMES: "${BACKUP_TIMES}"
  CACTUSINV_BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS}"
  CACTUSINV_BACKUP_MAX_UPLOAD_MB: "${BACKUP_MAX_UPLOAD_MB}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactusinv }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${K8S_STORAGE_CLASS}
  resources: { requests: { storage: ${K8S_MARIADB_STORAGE} } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: invoices
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactusinv }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${K8S_STORAGE_CLASS}
  resources: { requests: { storage: ${K8S_INVOICES_STORAGE} } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactusinv }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${K8S_STORAGE_CLASS}
  resources: { requests: { storage: ${K8S_BACKUP_STORAGE} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/name: mariadb, app.kubernetes.io/part-of: cactusinv }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: mariadb } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mariadb, app.kubernetes.io/part-of: cactusinv }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          env:
            - { name: TZ, value: "${TZ}" }
            - { name: MARIADB_DATABASE, value: "${MARIADB_DATABASE}" }
            - { name: MARIADB_USER, value: "${MARIADB_USER}" }
            - { name: MARIADB_PASSWORD_FILE, value: /run/secrets/db_password }
            - { name: MARIADB_ROOT_PASSWORD_FILE, value: /run/secrets/db_root_password }
          ports: [{ containerPort: 3306, name: mysql }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
          readinessProbe:
            exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: mariadb-data } }
        - { name: secrets, secret: { secretName: cactusinv-secrets } }
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactusinv }
spec:
  selector: { app.kubernetes.io/name: mariadb }
  ports: [{ port: 3306, targetPort: mysql }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cactusinv
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/name: cactusinv, app.kubernetes.io/part-of: cactusinv }
spec:
  # One replica: the invoices volume is ReadWriteOnce. With a ReadWriteMany class the
  # app scales out safely (workers coordinate through row locks).
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: cactusinv } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cactusinv, app.kubernetes.io/part-of: cactusinv }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532 }
      containers:
        - name: cactusinv
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: cactusinv-config } }]
          ports: [{ containerPort: 8080, name: http }]
          volumeMounts:
            - { name: invoices, mountPath: /data/invoices }
            - { name: backups, mountPath: /data/backups }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          # Up to 15 minutes to connect and run migrations before liveness applies: a pod
          # killed half-way through a (non-transactional) MariaDB migration cannot start again.
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 90 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          # A passphrase backup (age scrypt) needs ~256 MiB for a moment, one at a time.
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 768Mi } }
      volumes:
        - { name: invoices, persistentVolumeClaim: { claimName: invoices } }
        - { name: backups, persistentVolumeClaim: { claimName: backups } }
        # Only the keys the app reads (not db_root_password). optional: backup_key is added
        # by deploy.sh after the first rollout.
        - name: secrets
          secret:
            secretName: cactusinv-secrets
            optional: true
            items:
              - { key: db_password, path: db_password }
              - { key: smtp_password, path: smtp_password }
              - { key: app_key, path: app_key }
              - { key: backup_key, path: backup_key }
---
apiVersion: v1
kind: Service
metadata:
  name: cactusinv
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactusinv }
spec:
  type: NodePort
  # Local keeps the client's address (no SNAT), so the sign-in rate limit counts each
  # client on its own (ADR-011). The NodePort then answers only on the node running the
  # pod: on a multi-node cluster open that node (kubectl get pod -o wide) or put an
  # ingress in front.
  externalTrafficPolicy: Local
  selector: { app.kubernetes.io/name: cactusinv }
  ports: [{ port: 80, targetPort: http, nodePort: ${K8S_NODE_PORT} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: cactusinv }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: mailpit } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: cactusinv }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21
          ports: [{ containerPort: 1025, name: smtp }, { containerPort: 8025, name: web }]
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactusinv }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: web, port: 8025, targetPort: web, nodePort: ${K8S_MAILPIT_NODE_PORT} }
