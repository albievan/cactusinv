{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "cactusinv.labels" . | nindent 4 }}
type: Opaque
stringData:
  db_password: {{ required "secrets.dbPassword is required (or secrets.existingSecret)" .Values.secrets.dbPassword | quote }}
  db_root_password: {{ required "secrets.dbRootPassword is required (or secrets.existingSecret)" .Values.secrets.dbRootPassword | quote }}
  app_key: {{ required "secrets.appKey is required (or secrets.existingSecret)" .Values.secrets.appKey | quote }}
  admin_password: {{ required "secrets.adminPassword is required (or secrets.existingSecret)" .Values.secrets.adminPassword | quote }}
  {{- with .Values.secrets.smtpPassword }}
  smtp_password: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.backupKey }}
  backup_key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.metricsToken }}
  metrics_token: {{ . | quote }}
  {{- end }}
{{- end }}
