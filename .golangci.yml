# golangci-lint v2 configuration — part of `make check` (CLAUDE.md §3). The standard set
# (errcheck, govet, ineffassign, staticcheck, unused) is on by default in v2.
version: "2"
run:
  timeout: 5m
  build-tags: [integration]

linters:
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: receiver-naming
        - name: indent-error-flow
    depguard:
      rules:
        # The dependency rule: domain ← app ← ports ← adapters ← cmd (docs/ARCHITECTURE.md).
        domain:
          files: ["**/internal/domain/**"]
          list-mode: lax
          deny:
            - pkg: "github.com/albievan/cactusinv/internal/app"
              desc: "domain must not depend on app"
            - pkg: "github.com/albievan/cactusinv/internal/ports"
              desc: "domain must not depend on ports"
            - pkg: "github.com/albievan/cactusinv/internal/adapters"
              desc: "domain must not depend on adapters"
            - pkg: "database/sql"
              desc: "domain does no I/O"
            - pkg: "net/http"
              desc: "domain does no I/O"
            - pkg: "os"
              desc: "domain does no I/O"
            - pkg: "github.com/go-sql-driver/mysql"
              desc: "domain does no I/O"
        app:
          files: ["**/internal/app/**", "**/internal/ports/**"]
          list-mode: lax
          deny:
            - pkg: "github.com/albievan/cactusinv/internal/adapters"
              desc: "app and ports must not depend on adapters"
            - pkg: "database/sql"
              desc: "use ports, not the database"
            - pkg: "net/http"
              desc: "use ports, not HTTP"
            - pkg: "github.com/go-sql-driver/mysql"
              desc: "use ports, not the driver"
  exclusions:
    generated: lax
    # What v1 excluded by default.
    presets: [comments, common-false-positives, legacy, std-error-handling]
    paths:
      - internal/adapters/mariadb/sqlcgen
      - ".*\\.gen\\.go$"
    rules:
      # Test helpers may panic on setup failures.
      - path: _test\.go
        linters: [gosec]
      # Reviewed v2 findings that are not defects (M27):
      # the session cookie's Secure flag is CACTUSINV_COOKIE_SECURE (false for plain-HTTP LANs).
      - path: internal/adapters/http/middleware\.go
        text: "G124"
        linters: [gosec]
      # healthcheck calls the server's own address; the backup CLI writes where the operator says.
      - path: cmd/cactusinv/
        text: "G70[34]"
        linters: [gosec]
      # CheckRow compares len(row) with the columns just before indexing.
      - path: internal/domain/backup\.go
        text: "G602"
        linters: [gosec]
      # formatFixed: a negative int64 wraps to its two's-complement magnitude on purpose
      # (correct for math.MinInt64, whose negation overflows).
      - path: internal/domain/money\.go
        text: "G115"
        linters: [gosec]
      # The backup command's usage text is returned as its error, sentence and all.
      - path: cmd/cactusinv/backup\.go
        text: "ST1005"
        linters: [staticcheck]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
